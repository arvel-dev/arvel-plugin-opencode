# SPDX-License-Identifier: MIT-0
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: '1'
      - run: go run ./cmd/record-fixtures verify
  release:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Extract required release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh scripts/release-notes.sh "${RELEASE_TAG#v}" > "$RUNNER_TEMP/release-notes.md"
      - name: Build archives and create a draft
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
