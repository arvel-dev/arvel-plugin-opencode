name: opencode-usage
plugin: {}
initialize:
  connection: { kind: opencode }
steps:
  - call: _arvel/status
    expect: { state: ready }
  - call: session/new
    params: { cwd: "{{tmpdir}}", mcpServers: [] }
    save: { session: $.sessionId }
  - call: session/prompt
    params: { sessionId: "{{session}}", prompt: [ { type: text, text: "USAGE please" } ] }
    expectUpdates:
      - sessionUpdate: agent_message_chunk
    expect: { stopReason: end_turn }
  - call: _arvel/usage
    expect: { source: estimated }
