name: opencode-permission
plugin: {}
initialize:
  connection: { kind: opencode }
steps:
  - call: session/new
    params:
      cwd: "{{tmpdir}}"
      mcpServers: []
      _meta:
        arvel:
          permissions:
            read: allow
            edit: ask
            commands: { default: ask, allow: [ "go test *" ], deny: [ "git push *" ] }
            network: ask
    save: { session: $.sessionId }
  - call: session/prompt
    params: { sessionId: "{{session}}", prompt: [ { type: text, text: "please run the tests" } ] }
    answerPermissions: allow_once
    expectUpdates:
      - sessionUpdate: agent_message_chunk
    expect: { stopReason: end_turn }
