name: opencode-skills
plugin: {}
initialize:
  connection: { kind: opencode }
steps:
  - call: session/new
    params:
      cwd: "{{tmpdir}}"
      mcpServers: []
      _meta:
        arvel:
          instructions: "HELLO-SESSION-42"
          skills: []
    save: { session: $.sessionId }
  - call: session/prompt
    params: { sessionId: "{{session}}", prompt: [ { type: text, text: "SKILLS: show me" } ] }
    expectUpdates:
      - sessionUpdate: agent_message_chunk
        subset:
          content:
            text: "instruction=HELLO-SESSION-42"
    expect: { stopReason: end_turn }
